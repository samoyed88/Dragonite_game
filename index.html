<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>快龍的道館挑戰</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="console">
      <section class="screen" aria-label="遊戲主選單">
        <section id="menuScene" class="scene" aria-label="主選單場景">
          <h1 class="title">快龍的道館挑戰</h1>
          <p class="subtitle">DRAGONITE QUEST</p>

          <nav aria-label="主選單選項">
            <button class="menu-item is-selected" data-action="new" type="button">
              開始新遊戲
            </button>
            <button class="menu-item" data-action="load" type="button">
              讀取進度
            </button>
          </nav>

          <p id="statusText" class="status" role="status" aria-live="polite">
            ↑↓ 選擇　Enter 確認
          </p>
        </section>

        <section
          id="storyScene"
          class="scene is-hidden"
          aria-label="劇情開場"
          aria-hidden="true"
        >
          <p class="story-tag">劇情開場</p>
          <h2 id="storyTitle" class="story-title"></h2>
          <p id="storyText" class="story-text"></p>
          <p class="story-hint">Enter / Space：下一句</p>
        </section>

        <section
          id="mapScene"
          class="scene is-hidden"
          aria-label="世界地圖探索"
          aria-hidden="true"
        >
          <p class="story-tag">開放世界</p>
          <div id="mapViewport" class="map-viewport" aria-live="polite" aria-label="世界地圖視窗">
            <section class="map-hud map-hud-floating" aria-label="地圖資訊">
              <p id="locationTitle" class="map-location-title">真新鎮</p>
              <p id="locationMeta" class="map-location-meta">座標 (260, 980)・城鎮</p>
              <p id="mapDragoniteStatus" class="map-location-meta">快龍 Lv.10・HP 122/122</p>
              <p id="mapProgressStatus" class="map-location-meta">徽章 0/8・已探索 1 區</p>
            </section>
            <div id="mapWorld" class="map-world">
              <div id="roadsLayer" class="roads-layer"></div>
              <div id="landmarksLayer" class="landmarks-layer"></div>
              <div id="wildPokemonLayer" class="wild-pokemon-layer"></div>
              <div id="player" class="player">
                <img id="playerSprite" alt="快龍" loading="lazy" />
              </div>
            </div>
          </div>
          <p id="mapHint" class="map-hint">長按 ↑↓←→ 連續移動快龍　Enter / Space 探索</p>
          <section class="encounter-panel" aria-label="附近寶可夢">
            <p class="encounter-title">附近夥伴候選（PokéAPI）</p>
            <div id="encounterList" class="encounter-list"></div>
          </section>
          <p id="mapStatus" class="status">你站在真新鎮，旅程正式開始！</p>
        </section>

        <section
          id="encounterScene"
          class="scene is-hidden"
          aria-label="寶可夢相遇"
          aria-hidden="true"
        >
          <p class="story-tag" id="encounterTag">野生寶可夢出現！</p>
          <div class="enc-view">
            <img id="encSprite" class="enc-sprite" alt="" />
            <div class="enc-info">
              <p id="encName" class="enc-pokemon-name"></p>
              <p id="encRarity" class="enc-rarity"></p>
              <div class="enc-friend-bar">
                <div id="encFriendFill" class="enc-friend-fill"></div>
              </div>
              <p class="enc-friend-label">友好度</p>
            </div>
          </div>
          <p id="encMsg" class="enc-msg"></p>
          <nav class="enc-actions" aria-label="行動選項">
            <button class="enc-btn" data-enc="friend" type="button">
              <span class="enc-btn-key">1</span> 交朋友
            </button>
            <button class="enc-btn" data-enc="snack" type="button">
              <span class="enc-btn-key">2</span> 給零食
            </button>
            <button class="enc-btn" data-enc="observe" type="button">
              <span class="enc-btn-key">3</span> 觀察
            </button>
            <button class="enc-btn" data-enc="run" type="button">
              <span class="enc-btn-key">4</span> 離開
            </button>
          </nav>
          <p id="encPartyCount" class="status"></p>
        </section>

        <section
          id="gymScene"
          class="scene is-hidden"
          aria-label="道館對戰"
          aria-hidden="true"
        >
          <p class="story-tag" id="gymTag">道館挑戰</p>
          <h2 id="gymTitle" class="story-title"></h2>
          <div class="gym-battle-box">
            <div class="gym-side">
              <p id="gymAllyName" class="gym-label">快龍</p>
              <p id="gymDragoniteMeta" class="gym-meta"></p>
              <div class="gym-bar">
                <div id="gymDragoniteHpFill" class="gym-bar-fill"></div>
              </div>
              <p id="gymDragoniteHpText" class="gym-hp-text"></p>
            </div>
            <div class="gym-side">
              <p id="gymEnemyName" class="gym-label"></p>
              <p id="gymEnemyMeta" class="gym-meta"></p>
              <div class="gym-bar">
                <div id="gymEnemyHpFill" class="gym-bar-fill"></div>
              </div>
              <p id="gymEnemyHpText" class="gym-hp-text"></p>
            </div>
          </div>
          <p id="gymMsg" class="enc-msg"></p>
          <nav class="enc-actions" aria-label="道館戰指令">
            <button class="gym-btn" data-gym="claw" type="button">
              <span class="enc-btn-key">1</span> 龍爪
            </button>
            <button class="gym-btn" data-gym="thunder" type="button">
              <span class="enc-btn-key">2</span> 雷電拳
            </button>
            <button class="gym-btn" data-gym="heal" type="button">
              <span class="enc-btn-key">3</span> 回復
            </button>
            <button class="gym-btn" data-gym="retreat" type="button">
              <span class="enc-btn-key">4</span> 撤退
            </button>
            <button class="gym-btn" data-gym="switch" type="button">
              <span class="enc-btn-key">5</span> 換夥伴
            </button>
          </nav>
          <p id="gymStatus" class="status"></p>
        </section>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
